name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate ffmpeg payload
        shell: pwsh
        run: |
          $ffmpegPath = "${{ github.workspace }}\DiscordVideoCompressor\Resources\ffmpeg.exe"
          if (-not (Test-Path $ffmpegPath)) {
            throw "ffmpeg.exe was not found at $ffmpegPath"
          }

          $expectedHash = "CA7E2992D973AA5B042BE093EDA6FDCE43CA41AAFDD647148278589B1D753F60"
          $actualHash = (Get-FileHash $ffmpegPath -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "ffmpeg.exe checksum mismatch. Expected $expectedHash, got $actualHash."
          }

          $versionOutput = & $ffmpegPath -hide_banner -version | Select-Object -First 1
          if ($versionOutput -notmatch "ffmpeg version n8\.1") {
            throw "Unexpected FFmpeg version: $versionOutput"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Install NetSparkle appcast generator
        shell: pwsh
        run: dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator --version 2.9.0

      - name: Validate tag matches project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "${{ github.workspace }}\DiscordVideoCompressor\DiscordVideoCompressor.csproj"
          $projectVersion = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $tag = "${{ github.ref_name }}"
          if ($projectVersion -ne $tag) {
            throw "Git tag '$tag' does not match project version '$projectVersion'."
          }

      - name: Restore NetSparkle private key
        shell: pwsh
        run: |
          $keysDir = "${{ github.workspace }}\installer\keys"
          New-Item -ItemType Directory -Force -Path $keysDir | Out-Null
          Set-Content -Path (Join-Path $keysDir "NetSparkle_Ed25519.priv") -Value "${{ secrets.NETSPARKLE_PRIVATE_KEY }}" -NoNewline

      - name: Build solution
        shell: pwsh
        run: dotnet build "${{ github.workspace }}\DiscordVideoCompressor.sln" --configuration Release -warnaserror

      - name: Run tests
        shell: pwsh
        run: dotnet test "${{ github.workspace }}\DiscordVideoCompressor.Tests\DiscordVideoCompressor.Tests.csproj" --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Validate built application version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "${{ github.workspace }}\DiscordVideoCompressor\DiscordVideoCompressor.csproj"
          $targetFramework = $project.Project.PropertyGroup.TargetFramework | Select-Object -First 1
          $exePath = "${{ github.workspace }}\DiscordVideoCompressor\bin\Release\$targetFramework\DiscordVideoCompressor.exe"
          $fileVersion = (Get-Item $exePath).VersionInfo.FileVersion
          if (-not $fileVersion.StartsWith("${{ github.ref_name }}")) {
            throw "Built executable version '$fileVersion' does not match tag '${{ github.ref_name }}'."
          }

      - name: Build installer
        shell: pwsh
        run: |
          & "${{ github.workspace }}\installer\Build-Installer.ps1"

      - name: Generate appcast
        shell: pwsh
        run: |
          & "${{ github.workspace }}\installer\New-AppCast.ps1" `
            -ReleaseFile ".\output\DiscordVideoCompressor-Setup-${{ github.ref_name }}.exe" `
            -Version "${{ github.ref_name }}" `
            -GitHubTag "${{ github.ref_name }}"
        working-directory: ${{ github.workspace }}\installer

      - name: Package FFmpeg corresponding source
        shell: pwsh
        run: |
          & "${{ github.workspace }}\installer\New-ThirdPartySourceBundle.ps1"

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & "${{ github.workspace }}\installer\Publish-GitHubRelease.ps1" -Tag "${{ github.ref_name }}"
